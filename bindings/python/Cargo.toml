[package]
name = "openbnct-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Avila Labs"]
repository = "https://github.com/AvilaLabs/OpenBNCT"
license = "MIT"
publish = false

[lib]
name = "_openbnct"
crate-type = ["cdylib"]

[dependencies]
openbnct-avify = { path = "../../crates/openbnct-avify" }
openbnct-bio = { path = "../../crates/openbnct-bio" }
openbnct-boron = { path = "../../crates/openbnct-boron" }
openbnct-core = { path = "../../crates/openbnct-core" }
openbnct-dicom = { path = "../../crates/openbnct-dicom" }
openbnct-evidence = { path = "../../crates/openbnct-evidence" }
openbnct-transport = { path = "../../crates/openbnct-transport" }
openbnct-openmc = { path = "../../crates/openbnct-openmc" }
openbnct-plan = { path = "../../crates/openbnct-plan" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
openbnct-mcnp = { path = "../../crates/openbnct-mcnp" }
openbnct-nifti = { path = "../../crates/openbnct-nifti" }
openbnct-phits = { path = "../../crates/openbnct-phits" }
