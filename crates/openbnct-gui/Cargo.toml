[package]
name = "openbnct-gui"
description = "egui desktop shell for OpenBNCT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "openbnct-gui"
path = "src/main.rs"

[lib]
name = "openbnct_gui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
eframe.workspace = true
image.workspace = true
openbnct-bio = { path = "../openbnct-bio", version = "0.1.1" }
openbnct-core = { path = "../openbnct-core", version = "0.1.1" }
openbnct-dicom = { path = "../openbnct-dicom", version = "0.1.1" }
openbnct-evidence = { path = "../openbnct-evidence", version = "0.1.1" }
openbnct-nifti = { path = "../openbnct-nifti", version = "0.1.1" }
openbnct-openmc = { path = "../openbnct-openmc", version = "0.1.1" }
openbnct-plan = { path = "../openbnct-plan", version = "0.1.1" }
openbnct-transport = { path = "../openbnct-transport", version = "0.1.1" }
openbnct-view = { path = "../openbnct-view", version = "0.1.1" }
rfd = "0.17.2"
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }

[dev-dependencies]
tempfile = "3"
