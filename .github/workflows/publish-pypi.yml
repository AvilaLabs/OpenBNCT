name: publish Python package

# Manual runs publish to TestPyPI. A v* tag publishes the same validated
# distribution set to PyPI. Both publishing jobs use short-lived OIDC
# credentials — no stored tokens. The testpypi and pypi environments below
# carry the release gate (owner-configured required reviewers).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-wheels:
    name: Python distribution / Linux / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # pyproject.toml's license-files names both files, but neither is
      # committed under bindings/python: copy the workspace LICENSE in and
      # generate the notices from the bindings' own Cargo.lock. The notices
      # script runs cargo metadata --offline, which reads every locked
      # package (all targets), so fetch the whole lockfile first. maturin
      # silently omits a missing license file; check_python_release_set.py
      # fails the release if either is absent from any distribution.
      - name: Stage license files for packaging
        shell: bash
        run: |
          cargo fetch --manifest-path bindings/python/Cargo.toml --locked
          cp LICENSE bindings/python/LICENSE
          python scripts/third_party_notices.py \
            --manifest-path bindings/python/Cargo.toml \
            --output bindings/python/THIRD_PARTY_NOTICES.txt
      - name: Build source distribution
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.15.0
          working-directory: bindings/python
          args: --out ../../dist
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: "2014"
          working-directory: bindings/python
          args: --release --locked --compatibility pypi --out ../../dist
      - name: Smoke-test native wheel
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python scripts/smoke_python_wheel.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-linux-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  native-wheels:
    name: Python distribution / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stage license files for packaging
        shell: bash
        run: |
          cargo fetch --manifest-path bindings/python/Cargo.toml --locked
          cp LICENSE bindings/python/LICENSE
          python scripts/third_party_notices.py \
            --manifest-path bindings/python/Cargo.toml \
            --output bindings/python/THIRD_PARTY_NOTICES.txt
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          working-directory: bindings/python
          args: --release --locked --compatibility pypi --out ../../dist
      - name: Smoke-test wheel
        run: python scripts/smoke_python_wheel.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  assemble:
    name: Validate immutable Python distribution set
    needs: [linux-wheels, native-wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Require tag and package versions to agree
        if: github.event_name == 'push'
        run: >-
          python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('bindings/python/pyproject.toml').read_text())['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}',
          (os.environ['GITHUB_REF_NAME'], version)"
      - name: Validate complete release set
        run: python scripts/check_python_release_set.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openbnct
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist
      - name: Publish signed distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/openbnct
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist
      - name: Publish signed distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
