name: publish Rust crates

# A signed v* tag publishes the matching workspace version to crates.io via
# short-lived OIDC credentials (trusted publishing — no stored token). A
# workflow_dispatch run republishes a given tag, skipping crate versions that
# already exist so a partial release can resume.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed vX.Y.Z tag to publish or resume
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  OPENBNCT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: publish-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged Rust release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.OPENBNCT_RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Require tag and workspace versions to agree
        run: >-
          python3 -c "import os, pathlib, re, subprocess, tomllib;
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'];
          tag=os.environ['OPENBNCT_RELEASE_TAG'];
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), tag;
          assert tag == f'v{version}', (tag, version);
          tagged=subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{}}'], text=True).strip();
          head=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip();
          assert tagged == head, (tagged, head)"
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

  publish:
    name: Publish openbnct crates in dependency order
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: crates.io
      url: https://crates.io/search?q=openbnct
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.OPENBNCT_RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get short-lived crates.io credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -u
          ORDER="openbnct-core openbnct-evidence openbnct-nifti openbnct-phits \
                 openbnct-plan openbnct-transport openbnct-view openbnct-bio \
                 openbnct-boron openbnct-dicom openbnct-mcnp openbnct-openmc \
                 openbnct-gui openbnct-njoy openbnct-cli openbnct"
          VERSION=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          for crate in $ORDER; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: openbnct-release (github.com/AvilaLabs/OpenBNCT)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$code" = "200" ]; then
              echo "$crate $VERSION already published — skipping"
              continue
            fi
            for attempt in 1 2 3 4 5 6; do
              if cargo publish --locked --package "$crate"; then break; fi
              echo "retry $attempt for $crate (index lag or rate limit)"; sleep 90
            done
          done
