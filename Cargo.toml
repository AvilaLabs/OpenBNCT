[workspace]
members = [
  "crates/openbnct-bio",
  "crates/openbnct-boron",
  "crates/openbnct-core",
  "crates/openbnct-dicom",
  "crates/openbnct-view",
  "crates/openbnct-transport",
  "crates/openbnct-evidence",
  "crates/openbnct-openmc",
  "crates/openbnct-nifti",
  "crates/openbnct-njoy",
  "crates/openbnct-plan",
  "crates/openbnct-mcnp",
  "crates/openbnct-phits",
  "crates/openbnct-cli",
  "crates/openbnct-gui",
]
exclude = ["bindings/python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Avila Labs"]
repository = "https://github.com/AvilaLabs/OpenBNCT"
license = "Apache-2.0"
keywords = ["bnct", "dosimetry", "monte-carlo", "radiation-transport"]
categories = ["science"]
publish = true

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dicom-core = "=0.10.0"
dicom-dictionary-std = "=0.10.0"
dicom-object = "=0.10.0"
eframe = "0.36.1"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
